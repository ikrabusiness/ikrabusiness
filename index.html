<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKRA Business</title>
  <meta name="description" content="IKRA Business - müasir biznes xidmətləri.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: white;
    }

    .hero-content {
      max-width: 800px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .about {
      padding: 70px 20px;
      text-align: center;
    }

    .about-content {
      max-width: 700px;
      margin: auto;
    }

    .about h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">IKRA Business</div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>IKRA Business</h1>
      <p>
        Müasir biznes həlləri və müştəri yönümlü xidmətlər.
      </p>

      <a class="button" href="#about">
        Daha çox məlumat
      </a>
    </div>
  </section>

  <section class="about" id="about">
    <div class="about-content">
      <h2>IKRA haqqında</h2>
      <p>
        IKRA Business müasir texnologiyalar və süni intellekt
        həlləri ilə bizneslərin müştərilərlə daha effektiv
        əlaqə qurmasına kömək edir.
      </p>
    </div>
  </section>

  <footer>
    © 2026 IKRA Business. Bütün hüquqlar qorunur.
  </footer>

</body>
</html>
